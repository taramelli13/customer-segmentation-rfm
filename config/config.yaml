# Customer Segmentation Configuration

# Data Loading Configuration
data:
  raw_data_path: "data/raw/"
  processed_data_path: "data/processed/"
  features_path: "data/features/"
  file_name: "online_retail_raw.csv"

# Feature Engineering Configuration
features:
  # Analysis date for Recency calculation (auto uses max date in dataset)
  analysis_date: "auto"

  # Include return transactions in analysis
  include_returns: false

  # RFM scoring quantiles (1-5 scoring)
  rfm_scoring: true
  rfm_quantiles: 5

  # Additional features to calculate
  calculate_tenure: true
  calculate_product_diversity: true
  calculate_purchase_consistency: true

# Data Preprocessing Configuration
preprocessing:
  # Missing value handling
  drop_missing_customerid: true
  missing_threshold: 0.1  # Maximum acceptable missing data percentage

  # Outlier handling
  outlier_method: "percentile"  # "percentile" or "iqr"
  quantity_cap_percentile: 99
  price_floor: 0.01  # Minimum acceptable price

  # Return/cancellation handling
  exclude_cancelled_invoices: true
  cancelled_invoice_prefix: "C"

# Modeling Configuration
modeling:
  # Algorithms to use
  algorithms:
    - "kmeans"
    - "hierarchical"
    - "dbscan"

  # Random seed for reproducibility
  random_state: 42

  # K-Means parameters
  kmeans:
    n_clusters_range: [2, 10]
    n_init: 10
    max_iter: 300
    algorithm: "lloyd"

  # Hierarchical Clustering parameters
  hierarchical:
    linkage_methods:
      - "ward"
      - "complete"
      - "average"
    n_clusters_range: [2, 10]

  # DBSCAN parameters
  dbscan:
    eps_range: [0.3, 0.5, 0.7, 1.0]
    min_samples_range: [5, 10, 15, 20]

  # Features to use for clustering
  features_to_use: ["Recency", "Frequency", "Monetary"]
  feature_transformation: "log1p"

  # Feature scaling method
  scaling_method: "standard"  # "standard", "robust", or "minmax"

  # PCA for dimensionality reduction (null for no PCA)
  pca_components: null
  pca_variance_threshold: 0.95

# Evaluation Configuration
evaluation:
  # Metrics to calculate
  metrics:
    - "silhouette"
    - "davies_bouldin"
    - "calinski_harabasz"

  # Stability analysis
  stability_runs: 10
  bootstrap_samples: 100

  # Minimum acceptable scores
  min_silhouette_score: 0.4
  max_davies_bouldin: 1.5

# Visualization Configuration
visualization:
  # Output format
  figure_format: "png"
  figure_dpi: 300

  # Color palette
  color_palette: "Set2"

  # Plot sizes
  default_figsize: [10, 6]
  large_figsize: [14, 8]

  # Style
  style: "whitegrid"

# Output Configuration
output:
  figures_path: "outputs/figures/"
  models_path: "outputs/models/"
  reports_path: "outputs/reports/"

  # Save model artifacts
  save_models: true
  save_scaler: true
  save_feature_names: true

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "outputs/segmentation.log"

# Business Goal Alignment
business:
  # Target segment count (for business actionability)
  target_segment_count: [4, 6]

  # Minimum segment size (as percentage of total customers)
  min_segment_size_pct: 5

  # Focus areas
  identify_high_value: true
  identify_at_risk: true
  identify_growth_opportunities: true
